; PlatformIO project file for the CAN-to-Cellular Telemetry PoC
; Board: LILYGO T-SIM7670G-S3 (plain/non-Standard variant, LILYGO_T_SIM7670G_S3)
;   Product page: https://www.lilygo.cc/products/t-sim-7670g-s3
;   ESP32-S3-WROOM-1 module on this board has 16MB flash + 8MB Octal PSRAM,
;   which is why `board = esp32s3box` is used below (matches the PlatformIO
;   board definition LilyGo themselves use for this module: 16MB flash /
;   Octal PSRAM, native USB CDC). Do not switch to a plain "esp32-s3-devkitc-1"
;   board def -- it does not default to Octal PSRAM and will misconfigure the
;   flash/PSRAM SPI pins reserved on this exact module.
;
; https://docs.platformio.org/page/projectconf.html

[env:t-sim7670g-s3]
platform = espressif32@6.12.0
board = esp32s3box
framework = arduino

monitor_speed = 115200
monitor_filters =
    time
    default
    esp32_exception_decoder

extra_scripts =
    pre:load_env.py

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
    ; Makes PubSubClient chunk its writes instead of handing the whole packet
    ; to the network client in one call. Required for MQTT over TLS: the
    ; modem's SSL path sends via AT+CCHSEND, which caps a single send at
    ; ~1500 bytes and does not chunk internally (TinyGsmClientSIM7672.h,
    ; sslSend). A full batch is several KB, so unchunked publishes fail once
    ; a batch outgrows the cap -- silently, spooling to LittleFS.
    ;
    ; MUST stay <= 255: PubSubClient stores the per-chunk size in a uint8_t
    ; (PubSubClient.cpp, write()). A larger value truncates to 0, and the
    ; write loop then spins forever writing nothing. That's a hang, not an
    ; error, so do not "optimize" this upward.
    -DMQTT_MAX_TRANSFER_SIZE=255
build_unflags =
    -std=gnu++11

lib_deps =
    https://github.com/lewisxhe/TinyGSM-fork.git
    bblanchon/ArduinoJson@^7.2.0
    knolleary/pubsubclient@^2.8

board_build.filesystem = littlefs
board_build.partitions = partitions_16mb_littlefs.csv
