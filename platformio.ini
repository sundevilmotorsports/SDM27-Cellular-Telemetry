; PlatformIO project file for the CAN-to-Cellular Telemetry PoC
; Board: LILYGO T-SIM7670G-S3 (plain/non-Standard variant, LILYGO_T_SIM7670G_S3)
;   Product page: https://www.lilygo.cc/products/t-sim-7670g-s3
;   ESP32-S3-WROOM-1 module on this board has 16MB flash + 8MB Octal PSRAM,
;   which is why `board = esp32s3box` is used below (matches the PlatformIO
;   board definition LilyGo themselves use for this module: 16MB flash /
;   Octal PSRAM, native USB CDC). Do not switch to a plain "esp32-s3-devkitc-1"
;   board def -- it does not default to Octal PSRAM and will misconfigure the
;   flash/PSRAM SPI pins reserved on this exact module.
;
; https://docs.platformio.org/page/projectconf.html

[env:t-sim7670g-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32s3box
framework = arduino

monitor_speed = 115200
monitor_filters =
    time
    default
    esp32_exception_decoder

extra_scripts =
    pre:load_env.py

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; Recompiles the framework libraries (slow first build, cached after).
; T-Mobile hands this SIM an IPv6-only context, so PPP needs IPV6CP; the stock
; core only negotiates IPv4 over PPP. The TCP send buffer bounds uplink to
; SND_BUF / RTT -- 5744 bytes caps a ~200ms broker round trip near 230 kbps.
custom_sdkconfig =
    CONFIG_LWIP_PPP_ENABLE_IPV6=y
    CONFIG_LWIP_TCP_SND_BUF_DEFAULT=32768
    CONFIG_LWIP_TCP_WND_DEFAULT=16384

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

board_build.filesystem = littlefs
board_build.partitions = partitions_16mb_littlefs.csv
