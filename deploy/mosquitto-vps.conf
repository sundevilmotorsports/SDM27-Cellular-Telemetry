# Mosquitto config for a PUBLIC VPS broker (SDM27 Telemetry PoC).
#
# This is deliberately NOT the repo's top-level mosquitto.conf: that one sets
# `allow_anonymous true`, which is fine on a laptop behind NAT during bench
# testing and is a liability the moment the broker has a public IP. Anyone
# scanning port 1883 could otherwise subscribe to your vehicle data or publish
# forged batches into it.
#
# Install to /etc/mosquitto/mosquitto.conf on the VPS. See deploy/README.md.

# ---- Listeners ---------------------------------------------------------
# Plain MQTT: the ESP32 (via the SIM7670G over cellular) and any
# mosquitto_sub / listener.py client connect here.
listener 1883 0.0.0.0
protocol mqtt

# WebSocket: browsers can't open raw TCP, so web/dashboard.html needs its own
# listener. Same broker, same topics -- only the wire framing differs.
listener 9001 0.0.0.0
protocol websockets

# ---- Authentication ----------------------------------------------------
# No unauthenticated access on either listener. Create the password file with:
#   mosquitto_passwd -c /etc/mosquitto/passwd esp32
allow_anonymous false
password_file /etc/mosquitto/passwd

# ---- Persistence -------------------------------------------------------
# Survives a broker restart. Note this persists sessions/retained messages,
# NOT a history of telemetry -- subscribers only ever see batches published
# after they connect, since the firmware publishes at QoS 0 without retain.
persistence true
persistence_location /var/lib/mosquitto/

# ---- Logging -----------------------------------------------------------
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# ---- Resource limits ---------------------------------------------------
# A public broker is a public target. These bound what a flood of connections
# can cost you before fail2ban or the firewall notices.
max_connections 100
max_inflight_messages 20
message_size_limit 65536
