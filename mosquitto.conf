# Mosquitto broker configuration for SDM27 Telemetry PoC

# Standard MQTT listener for TCP clients (ESP32 publisher & listener.py)
# Binding to 0.0.0.0 allows connections from ESP32 across the Wi-Fi network (192.168.4.x)
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket listener for web dashboard (web/dashboard.html)
listener 9001 0.0.0.0
protocol websockets
