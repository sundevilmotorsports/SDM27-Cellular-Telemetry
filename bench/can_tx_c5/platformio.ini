; Bench CAN FD traffic generator: ESP32-C5-DevKitC-1 (its own TWAI-FD
; controller) + Adafruit CAN Pal (TJA1051T/3 transceiver). Puts random
; classic and CAN FD frames on the breadboard bus for the main
; T-SIM7670G-S3 + MCP2518FD telemetry node to receive and publish. Separate
; PlatformIO project from the repo root -- build/flash it from this folder:
;
;   cd bench/can_tx_c5
;   pio run -t upload
;   pio device monitor
;
; See ../README.md for the wiring and the end-to-end test procedure.

[env:esp32-c5-devkitc-1]
; Same pioarduino platform as the main firmware (Arduino core 3.x on
; ESP-IDF 5.5, the first with ESP32-C5 and its TWAI-FD driver).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino

monitor_speed = 115200

build_flags =
    ; Serial on the C5's native USB-C port (labelled USB), so one cable
    ; flashes and monitors. Drop this to use the UART port instead.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Must match CAN_BITRATE_KBPS / CAN_FD_DATA_BITRATE_KBPS in the main
    ; firmware's include/can_pins.h.
    -DBENCH_CAN_BITRATE=500000
    -DBENCH_CAN_FD_DATA_BITRATE=2000000
    ; Starting frame rate; change at runtime with +/- over serial. Frames
    ; average ~115 bytes of JSON on the uplink, so 10 Hz is ~4 MB/hr.
    -DBENCH_TX_RATE_HZ=10
